name: publish
# Releases JeeG automatically.
#   Push a new version number in jeeg.py (__version__) to the main branch and this workflow will:
#   run the tests, build the package, create the tag and the GitHub release (with the CHANGELOG notes and the files),
#   and upload to PyPI. A version that already has a tag is skipped, so ordinary pushes do nothing.
# You can also publish a release by hand on GitHub, or press "Run workflow" on the Actions tab.
# PyPI upload is switched on by the repository variable PUBLISH_PYPI = true (see the pypi job).
on:
  push:
    branches: [main]
    paths: ["jeeg.py"]
  release:
    types: [published]
  workflow_dispatch:
permissions:
  contents: write
  id-token: write
  attestations: write
concurrency:
  group: publish
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      go: ${{ steps.v.outputs.go }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: v
        name: Read the version and decide whether this is a new release
        run: |
          V=$(python3 -c "import re;print(re.search(r'__version__ = \"([^\"]+)\"', open('jeeg.py').read()).group(1))")
          echo "version=$V" >> "$GITHUB_OUTPUT"
          if [ "${{ github.event_name }}" = "release" ]; then
            [ "v$V" = "${GITHUB_REF_NAME}" ] || { echo "Tag ${GITHUB_REF_NAME} does not match version $V"; exit 1; }
            echo "go=true" >> "$GITHUB_OUTPUT"
          elif git rev-parse -q --verify "refs/tags/v$V" >/dev/null; then
            echo "Version $V already has a tag - nothing to release."
            echo "go=false" >> "$GITHUB_OUTPUT"
          else
            echo "go=true" >> "$GITHUB_OUTPUT"
          fi
  build:
    needs: check
    if: needs.check.outputs.go == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run the tests
        run: |
          python jeeg.py selftest
          python tests/test_routing.py
          python tests/test_parsers.py
          python tests/test_engine.py
          python tests/test_cmds.py
          python tests/test_v26.py
          python tests/test_v27.py
          python tests/test_api.py
          python tests/test_bridge.py
          python tests/test_v28.py
          python tests/test_quality.py
          python tests/test_privacy.py
          python tests/test_security.py
      - name: Build
        run: |
          python -m pip install build
          python -m build
          cd dist && sha256sum * > SHA256SUMS.txt
      - name: Sign the build (provenance)
        uses: actions/attest-build-provenance@v1
        with:
          subject-path: "dist/*.whl, dist/*.tar.gz"
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
  assets:
    # Creates the tag and the GitHub release (or, for a release you made by hand, attaches the files to it).
    needs: [check, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Create the release, or attach the files
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          V: ${{ needs.check.outputs.version }}
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            gh release upload "v$V" dist/* --clobber
          else
            # notes = the "## <version>" section of CHANGELOG.md
            awk -v v="$V" '$0 ~ "^## "v"$" {f=1; next} /^## / {f=0} f' CHANGELOG.md > notes.md
            [ -s notes.md ] || echo "JeeG $V" > notes.md
            gh release create "v$V" dist/* --target "${GITHUB_SHA}" --title "JeeG $V" --notes-file notes.md
          fi
  pypi:
    # Only runs when you add a repository variable PUBLISH_PYPI = true (Settings > Secrets and variables > Actions > Variables)
    # after setting up the PyPI trusted publisher. Re-uploading an existing version is skipped, not an error.
    needs: [build, assets]
    if: ${{ !cancelled() && needs.build.result == 'success' && needs.assets.result == 'success' && vars.PUBLISH_PYPI == 'true' }}
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          skip-existing: true
