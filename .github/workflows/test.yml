name: tests
on: [push, pull_request]
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.9", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Self test (every script resolves by its own name)
        run: python jeeg.py selftest
      - name: Routing and multi-task tests
        run: python tests/test_routing.py
      - name: Parser tests
        run: python tests/test_parsers.py
      - name: Engine tests
        run: python tests/test_engine.py
      - name: Command tests (update, plugins, web page)
        run: python tests/test_cmds.py
      - name: v2.6 tests (library, sharing, tracking)
        run: python tests/test_v26.py
      - name: v2.7 tests (json, tour, new tasks, speed)
        run: python tests/test_v27.py
      - name: Privacy checks
        run: python tests/test_privacy.py
      - name: Security tests
        run: python tests/test_security.py
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build the wheel and run it from a clean environment
        run: |
          python -m pip install build
          python -m build
          python -m venv /tmp/v
          /tmp/v/bin/pip install dist/*.whl
          cd /tmp && /tmp/v/bin/jeeg --version && /tmp/v/bin/jeeg selftest
