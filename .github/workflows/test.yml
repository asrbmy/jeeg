name: tests
on: [push, pull_request]
jobs:
  test:
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.9", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Self test (every script resolves by its own name)
        run: python jeeg.py selftest
      - name: Selfcheck (real tasks, local server and AI mode on this operating system)
        run: python jeeg.py selfcheck
      - name: Routing and multi-task tests
        run: python tests/test_routing.py
      - name: Parser tests
        run: python tests/test_parsers.py
      - name: Engine tests
        run: python tests/test_engine.py
      - name: Command tests (update, plugins, web page)
        run: python tests/test_cmds.py
      - name: v2.6 tests (library, sharing, tracking)
        run: python tests/test_v26.py
      - name: v2.7 tests (json, tour, new tasks, speed)
        run: python tests/test_v27.py
      - name: Python library tests (import jeeg)
        run: python tests/test_api.py
      - name: Bridge tests (local API, JSON lines, MCP)
        run: python tests/test_bridge.py
      - name: New in 2.8 and quality gates
        run: |
          python tests/test_v28.py
          python tests/test_v29.py
          python tests/test_v210.py
          python tests/test_phone.py
          python tests/test_remote.py
          python tests/test_fuzz.py
          python tests/test_connect.py
          python tests/test_quality.py
      - name: New in 2.11 to 2.20, everyday tasks, administrator policy, audit log, data upgrades
        run: |
          python tests/test_v217.py
          python tests/test_v218.py
          python tests/test_v219.py
          python tests/test_v220.py
          python tests/test_everyday.py
          python tests/test_more.py
          python tests/test_prod.py
          python tests/test_update.py
      - name: Desktop window (Linux, virtual display)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update && sudo apt-get install -y xvfb python3-tk
          xvfb-run -a python3 tests/test_gui.py
        continue-on-error: true
      - name: Real browser control (Chrome is preinstalled on the runners)
        run: python tests/test_browser.py
        continue-on-error: true
      - name: Privacy checks
        run: python tests/test_privacy.py
      - name: Security tests
        run: python tests/test_security.py
  package:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build the wheel and run it from a clean environment
        run: |
          python -m pip install build
          python -m build
          python -m venv /tmp/v
          /tmp/v/bin/pip install dist/*.whl
          cd /tmp && /tmp/v/bin/jeeg --version && /tmp/v/bin/jeeg selftest
