name: tests
on: [push, pull_request]
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.9", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Self test (every script resolves by its own name)
        run: python jeeg.py selftest
      - name: Routing and multi-task tests
        run: python tests/test_routing.py
      - name: Parser tests
        run: python tests/test_parsers.py
      - name: Engine tests
        run: python tests/test_engine.py
      - name: Security tests
        run: python tests/test_security.py
