<svg xmlns="http://www.w3.org/2000/svg" width="720" height="182" viewBox="0 0 720 182" role="img" aria-label="Local API for other programs"><rect width="720" height="182" rx="10" fill="#1b1c1a"/><rect width="720" height="30" rx="10" fill="#2a2b28"/><rect y="20" width="720" height="10" fill="#2a2b28"/><circle cx="18" cy="15" r="5" fill="#ff5f56"/><circle cx="36" cy="15" r="5" fill="#ffbd2e"/><circle cx="54" cy="15" r="5" fill="#27c93f"/><text x="360" y="20" text-anchor="middle" fill="#9a9a96" font-family="system-ui,sans-serif" font-size="12">Local API for other programs</text><g font-family="ui-monospace,Menlo,Consolas,monospace" font-size="13.5"><text x="16" y="60" fill="#7ee0c3" xml:space="preserve">$ jeeg --serve-api</text><text x="16" y="80" fill="#8d8d8d" xml:space="preserve">JeeG API: http://127.0.0.1:8766/v1/  (this computer only)</text><text x="16" y="100" fill="#8d8d8d" xml:space="preserve">Token: ********</text><text x="16" y="120" fill="#7ee0c3" xml:space="preserve">$ curl -H &quot;Authorization: Bearer $TOKEN&quot; -d &#x27;{&quot;query&quot;:&quot;gst 2500 18&quot;}&#x27; \</text><text x="16" y="140" fill="#7ee0c3" xml:space="preserve">      http://127.0.0.1:8766/v1/run</text><text x="16" y="160" fill="#e6e6e6" xml:space="preserve">{&quot;ok&quot;: true, &quot;result&quot;: {&quot;exit&quot;: 0, &quot;ok&quot;: true, &quot;task&quot;: &quot;gst_amount&quot;, &quot;output&quot;: &quot;...&quot;}}</text></g></svg>