<svg xmlns="http://www.w3.org/2000/svg" width="720" height="262" viewBox="0 0 720 262" role="img" aria-label="JeeG in the terminal"><rect width="720" height="262" rx="10" fill="#1b1c1a"/><rect width="720" height="30" rx="10" fill="#2a2b28"/><rect y="20" width="720" height="10" fill="#2a2b28"/><circle cx="18" cy="15" r="5" fill="#ff5f56"/><circle cx="36" cy="15" r="5" fill="#ffbd2e"/><circle cx="54" cy="15" r="5" fill="#27c93f"/><text x="360" y="20" text-anchor="middle" fill="#9a9a96" font-family="system-ui,sans-serif" font-size="12">JeeG in the terminal</text><g font-family="ui-monospace,Menlo,Consolas,monospace" font-size="13.5"><text x="16" y="60" fill="#7ee0c3" xml:space="preserve">$ jeeg gst 2500 18</text><text x="16" y="80" fill="#e6e6e6" xml:space="preserve">&gt;&gt; gst amount  (2500 18)</text><text x="16" y="100" fill="#e6e6e6" xml:space="preserve">Add GST at 18%</text><text x="16" y="120" fill="#e6e6e6" xml:space="preserve">  Base price : 2,500.00</text><text x="16" y="140" fill="#e6e6e6" xml:space="preserve">  GST        : 450.00   (CGST 225.00 + SGST 225.00)</text><text x="16" y="160" fill="#e6e6e6" xml:space="preserve">  Total      : 2,950.00</text><text x="16" y="180" fill="#7ee0c3" xml:space="preserve">$ jeeg gst 2500 18 then save it to a note</text><text x="16" y="200" fill="#e6e6e6" xml:space="preserve">&gt;&gt; gst amount  (2500 18)</text><text x="16" y="220" fill="#e6e6e6" xml:space="preserve">Add GST at 18%</text><text x="16" y="240" fill="#e6e6e6" xml:space="preserve">  Base price : 2,500.00</text></g></svg>