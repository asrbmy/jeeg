<svg xmlns="http://www.w3.org/2000/svg" width="720" height="262" viewBox="0 0 720 262" role="img" aria-label="Use JeeG from Python"><rect width="720" height="262" rx="10" fill="#1b1c1a"/><rect width="720" height="30" rx="10" fill="#2a2b28"/><rect y="20" width="720" height="10" fill="#2a2b28"/><circle cx="18" cy="15" r="5" fill="#ff5f56"/><circle cx="36" cy="15" r="5" fill="#ffbd2e"/><circle cx="54" cy="15" r="5" fill="#27c93f"/><text x="360" y="20" text-anchor="middle" fill="#9a9a96" font-family="system-ui,sans-serif" font-size="12">Use JeeG from Python</text><g font-family="ui-monospace,Menlo,Consolas,monospace" font-size="13.5"><text x="16" y="60" fill="#7ee0c3" xml:space="preserve">&gt;&gt;&gt; import jeeg</text><text x="16" y="80" fill="#7ee0c3" xml:space="preserve">&gt;&gt;&gt; r = jeeg.run(&quot;sip goal 1 million in 15 years at 8%&quot;)</text><text x="16" y="100" fill="#7ee0c3" xml:space="preserve">&gt;&gt;&gt; print(r.ok, r.task)</text><text x="16" y="120" fill="#e6e6e6" xml:space="preserve">True sip_goal</text><text x="16" y="140" fill="#7ee0c3" xml:space="preserve">&gt;&gt;&gt; print(r.output)</text><text x="16" y="160" fill="#e6e6e6" xml:space="preserve">To reach 1,000,000 in 15 years at 8% a year:</text><text x="16" y="180" fill="#e6e6e6" xml:space="preserve">  Save every month : 2,889.85</text><text x="16" y="200" fill="#e6e6e6" xml:space="preserve">  You put in       : 520,174</text><text x="16" y="220" fill="#7ee0c3" xml:space="preserve">&gt;&gt;&gt; jeeg.gst_amount(1000, 18).ok</text><text x="16" y="240" fill="#e6e6e6" xml:space="preserve">True</text></g></svg>