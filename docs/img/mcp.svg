<svg xmlns="http://www.w3.org/2000/svg" width="720" height="182" viewBox="0 0 720 182" role="img" aria-label="JeeG as an MCP tool"><rect width="720" height="182" rx="10" fill="#1b1c1a"/><rect width="720" height="30" rx="10" fill="#2a2b28"/><rect y="20" width="720" height="10" fill="#2a2b28"/><circle cx="18" cy="15" r="5" fill="#ff5f56"/><circle cx="36" cy="15" r="5" fill="#ffbd2e"/><circle cx="54" cy="15" r="5" fill="#27c93f"/><text x="360" y="20" text-anchor="middle" fill="#9a9a96" font-family="system-ui,sans-serif" font-size="12">JeeG as an MCP tool</text><g font-family="ui-monospace,Menlo,Consolas,monospace" font-size="13.5"><text x="16" y="60" fill="#7ee0c3" xml:space="preserve">$ jeeg --mcp --only money,text</text><text x="16" y="80" fill="#8d8d8d" xml:space="preserve">(your app connects; JeeG answers with tools:)</text><text x="16" y="100" fill="#e6e6e6" xml:space="preserve">jeeg_run   - run a task from plain words</text><text x="16" y="120" fill="#e6e6e6" xml:space="preserve">jeeg_find  - which task matches a phrase</text><text x="16" y="140" fill="#e6e6e6" xml:space="preserve">jeeg_list  - list the allowed tasks</text><text x="16" y="160" fill="#8d8d8d" xml:space="preserve">Tasks outside money and text are refused.</text></g></svg>